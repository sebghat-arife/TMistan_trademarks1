# Railway — https://docs.railway.com/reference/config-as-code
# Build-time variables (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SITE_*) are read
# from the service's Variables tab; Railway passes them to the Dockerfile as
# build args automatically. Set them BEFORE the first deploy.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
