# Render Blueprint — TMistan (Vite/React SPA, no server) → Render STATIC SITE.
# https://render.com/docs/blueprint-spec
#
# Dashboard equivalent (if you create the service by hand instead of via Blueprint):
#   Service type ....... Static Site
#   Root Directory ..... web
#   Build Command ...... npm ci && npm run build
#   Publish Directory .. dist
#   Redirects/Rewrites . /*  →  /app.html   (Rewrite — the SPA shell; prerendered pages are real files and win)
#   Environment ........ SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY   (public values; NEVER the secret key)
#                        optional: SITE_MASNAD_URL (public website of Masnad Law Firm linked from the
#                        homepage/footer; defaults to https://www.masnadip.af/ — empty string = no link)
#                        optional: SITE_CANONICAL_URL (canonical public origin — canonical/hreflang links,
#                        sitemap, structured data, PDF reports; defaults to https://tmistan.com, the apex
#                        domain to which www. redirects)
#                        optional: SITE_GA4_MEASUREMENT_ID (Google Analytics 4 "G-…" id; analytics load only
#                        after the visitor agrees — see docs/SEO.md)
#
#   SEO (docs/SEO.md): `npm run build` also prerenders every public page (3 languages), eligible
#   trademark records, sitemap.xml and robots.txt into dist/ — still a plain static site.
#
#   "Search by Image" (text recognition + near-duplicate matching) needs NO second service and no
#   extra variable: the recogniser (Tesseract.js) is served from this static site (web/public/ocr/)
#   and runs in the visitor's browser; the index lives in Supabase (supabase/APPLY_1300.sql).
#   Monthly cost of this blueprint: $0 (static site on the free tier). See docs/IMAGE_SEARCH.md.
#
# The two Supabase values are read at BUILD time by web/vite.config.ts and
# inlined into the JS bundle (Vite apps have no runtime environment).
services:
  - type: web
    name: tmistan
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - web/**
    envVars:
      - key: SUPABASE_URL
        sync: false                       # prompt in dashboard: https://<ref>.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false                       # prompt in dashboard: sb_publishable_... (public)
      - key: NODE_VERSION
        value: "22.12.0"                  # matches web/.node-version (Vite 8 needs 20.19+ / 22.12+)
      - key: SITE_MASNAD_URL
        value: https://www.masnadip.af/   # public Masnad Law Firm website (not a secret); "" disables the link
      - key: SITE_CANONICAL_URL
        value: https://tmistan.com        # canonical public origin (apex; www. 301s here) — canonicals, hreflang, sitemap, PDFs
      - key: SITE_GOOGLE_SITE_VERIFICATION
        sync: false                       # optional: Google Search Console HTML-tag token (content value only) → <meta name="google-site-verification">
      - key: SITE_BING_SITE_VERIFICATION
        sync: false                       # optional: Bing Webmaster Tools token → <meta name="msvalidate.01">
      - key: SITE_GA4_MEASUREMENT_ID
        sync: false                       # optional: GA4 measurement ID (G-XXXXXXXXXX); loaded only after visitor consent
    routes:
      - type: rewrite                     # client-side routing: URLs without a prerendered file serve the SPA shell
        source: /*
        destination: /app.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow          # administration area is never indexed (the pages also carry a robots meta tag)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ocr/*
        name: Cache-Control
        value: public, max-age=604800     # Tesseract language models (web/public/ocr/tessdata); the browser also keeps them in IndexedDB
