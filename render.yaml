# Render Blueprint — TMistan (Vite/React SPA, no server) → Render STATIC SITE.
# https://render.com/docs/blueprint-spec
#
# Dashboard equivalent (if you create the service by hand instead of via Blueprint):
#   Service type ....... Static Site
#   Root Directory ..... web
#   Build Command ...... npm ci && npm run build
#   Publish Directory .. dist
#   Redirects/Rewrites . /*  →  /index.html   (Rewrite)
#   Environment ........ SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY   (public values; NEVER the secret key)
#                        optional: SITE_MASNAD_URL (public website of Masnad Law Firm linked from the
#                        homepage/footer; defaults to https://www.masnadip.af/ — empty string = no link)
#                        optional: SITE_CANONICAL_URL (public origin used in generated PDF reports;
#                        defaults to https://www.tmistan.com)
#
#   "Search by Image" (text recognition + near-duplicate matching) needs NO second service and no
#   extra variable: the recogniser (Tesseract.js) is served from this static site (web/public/ocr/)
#   and runs in the visitor's browser; the index lives in Supabase (supabase/APPLY_1300.sql).
#   Monthly cost of this blueprint: $0 (static site on the free tier). See docs/IMAGE_SEARCH.md.
#
# The two Supabase values are read at BUILD time by web/vite.config.ts and
# inlined into the JS bundle (Vite apps have no runtime environment).
services:
  - type: web
    name: tmistan
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - web/**
    envVars:
      - key: SUPABASE_URL
        sync: false                       # prompt in dashboard: https://<ref>.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false                       # prompt in dashboard: sb_publishable_... (public)
      - key: NODE_VERSION
        value: "22.12.0"                  # matches web/.node-version (Vite 8 needs 20.19+ / 22.12+)
      - key: SITE_MASNAD_URL
        value: https://www.masnadip.af/   # public Masnad Law Firm website (not a secret); "" disables the link
      - key: SITE_CANONICAL_URL
        value: https://www.tmistan.com    # canonical public origin used for links inside generated PDF reports
    routes:
      - type: rewrite                     # client-side routing: every path serves the SPA
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ocr/*
        name: Cache-Control
        value: public, max-age=604800     # Tesseract language models (web/public/ocr/tessdata); the browser also keeps them in IndexedDB
